# Local profile: full version of the book, including personal notes.
# Use: QUARTO_PROFILE=local quarto render   (or quarto preview)
# The default profile (used by publish.sh) excludes all personal content.

project:
  render:
    - index.qmd
    - lectures/*.qmd
    - interventions/*.qmd
    - slides.qmd
    - personal/estimating-beta.qmd

book:
  chapters:
    - index.qmd
    - lectures/01-odin-basics-sir.qmd
    - lectures/02-extending-models.qmd
    - interventions/school-closure.qmd
    - interventions/mass-screening.qmd
    - slides.qmd
    - personal/estimating-beta.qmd

resources:
  - slides/*.html
  - personal/*.html
